<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stretch-Rx</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Stretch-Rx</h1>
    <p class="tagline">Search, filter, and favorite stretches by body area or purpose.</p>
    <div class="controls">
      <input id="search" type="search" placeholder="Search stretches or muscles…" />
      <div class="filters">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="upper">Upper Body</button>
        <button class="chip" data-filter="lower">Lower Body</button>
        <button class="chip" data-filter="full">Full Body</button>
        <button class="chip" data-filter="recovery">Recovery</button>
        <button class="chip" data-filter="warmup">Warm-Up</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section>
      <h2 class="section-title">Stretches</h2>
      <div id="cards" class="grid"></div>
    </section>

    <section>
      <h2 class="section-title">Favorites</h2>
      <div id="favorites" class="grid"></div>
    </section>
  </main>

  <template id="card-tpl">
    <article class="card">
        <img class="thumb" alt="">
        <div class="card-head">
            <h3 class="name"></h3>
            <button class="fav" title="Toggle favorite">☆</button>
        </div>
        <p class="meta"></p>
        <details>
            <summary>Steps</summary>
            <ol class="steps"></ol>
        </details>
    </article>
 </template>


<script src="app.js"></script>
</body>
</html>
